name: health_monitor.py

on:
  schedule:
    - cron: '20 * * * *'   # every hour at :20
  workflow_dispatch:

# Least privilege (2026-09-24) — reads the checkout, calls external APIs only.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run
        env:
          TWILIO_ACCOUNT: ${{ secrets.TWILIO_ACCOUNT }}
          TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SCORE_INGEST_URL: ${{ secrets.SCORE_INGEST_URL }}
          SCORE_API_URL: ${{ secrets.SCORE_API_URL }}
          DIALS_INGEST_URL: ${{ secrets.DIALS_INGEST_URL }}
          TIPS_INGEST_URL: ${{ secrets.TIPS_INGEST_URL }}
          TOPCALL_INGEST_URL: ${{ secrets.TOPCALL_INGEST_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SHIFT_OVERRIDE_API_URL: ${{ secrets.SHIFT_OVERRIDE_API_URL }}
          ANOMALY_STATE_API_URL: ${{ secrets.ANOMALY_STATE_API_URL }}
          ANOMALY_STATE_INGEST_URL: ${{ secrets.ANOMALY_STATE_INGEST_URL }}
          # Make.com read APIs. These were hardcoded in health_monitor.py in this
          # PUBLIC repo, so treat them as burned: rotate in Make.com, set these
          # four secrets, THEN delete the fallbacks in the script.
          # An unset secret resolves to "" and the script falls back, so landing
          # these before the secrets exist is safe.
          BOOKING_API_URL: ${{ secrets.BOOKING_API_URL }}
          DIALS_API_URL: ${{ secrets.DIALS_API_URL }}
          TIPS_API_URL: ${{ secrets.TIPS_API_URL }}
          TOPCALL_API_URL: ${{ secrets.TOPCALL_API_URL }}
        run: python scripts/health_monitor.py
